version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: life-diary_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    build: ./web
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      CONFIG_PATH: /data/config.json
      ALLOW_REGISTRATION: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/data
